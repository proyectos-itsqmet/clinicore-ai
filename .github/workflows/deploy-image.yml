name: Despliegue en DockerHub

on:
  push:
    tags:
      - "*.*.*-*"

jobs:
  deploy:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    # Pasos del job
    steps:
      # Paso 1
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # Paso 2
      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 3
      - name: Compilar y subir imagen
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chatbot_qms:latest
            ${{ secrets.DOCKER_USERNAME }}/chatbot_qms:${{ github.ref_name }}
